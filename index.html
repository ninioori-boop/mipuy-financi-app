<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>הכלכלן של הבית — המערכת שודרגה</title>
<style>
  :root {
    --gold: #C9A86C;
    --gold-light: #E0C896;
    --surface: #0F0F0F;
    --surface2: #1A1A1A;
    --line: #2A2A2A;
    --txt: #F0EDEA;
    --muted: #8A8178;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", Rubik, Arial, sans-serif;
    background: var(--surface);
    color: var(--txt);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100vh;
  }
  .card {
    background: var(--surface2);
    border: 1px solid var(--line);
    border-radius: 20px;
    max-width: 480px;
    width: 100%;
    padding: 48px 32px;
    text-align: center;
  }
  .logo {
    width: 88px;
    height: 88px;
    object-fit: contain;
    border-radius: 16px;
    margin: 0 auto 28px;
    display: block;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--gold);
  }
  p {
    font-size: 1.02rem;
    line-height: 1.8;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .divider {
    height: 1px;
    background: var(--line);
    margin: 28px 0;
  }
  .brand {
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="הכלכלן של הבית" class="logo">
    <h1>המערכת שודרגה</h1>
    <p>מערכת המיפוי הפיננסי עברה לגרסה חדשה ומשופרת.</p>
    <p>לקוחות קיימים — להמשך שימוש ולפרטים, אנא צרו קשר.</p>
    <div class="divider"></div>
    <div class="brand">הכלכלן של הבית</div>
  </div>
</body>
</html>
